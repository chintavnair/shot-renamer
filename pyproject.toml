[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shot-renamer"
version = "0.1.0"
description = "Rename film takes from the spoken slate using ffmpeg and Whisper"
requires-python = ">=3.10"
dependencies = ["faster-whisper>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
shot-renamer = "shotrenamer.cli:main"

[tool.setuptools.packages.find]
include = ["shotrenamer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
